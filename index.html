<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kelola Deposit</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #f4f6f9;
      color: #333;
      display: flex;
      justify-content: center;
      padding: 10px;
    }

    .container {
      width: 100%;
      max-width: 480px;
      background: #ffffff;
      border: 1px solid #e1e4e8;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
    }

    /* Navbar */
    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 16px;
      border-bottom: 1px solid #e5e7eb;
    }

    .nav-left {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 1.1rem;
      font-weight: 700;
      color: #1f2937;
    }

    .menu-icon {
      font-size: 1.4rem;
      cursor: pointer;
    }

    .nav-right {
      font-size: 0.9rem;
      color: #4b5563;
      cursor: pointer;
    }

    /* Alert */
    .alert {
      display: none;
      background-color: #d1fae5;
      color: #065f46;
      border: 1px solid #a7f3d0;
      padding: 12px;
      margin: 12px 16px 0;
      border-radius: 4px;
      font-size: 0.85rem;
      text-align: center;
    }

    /* Card Content */
    .card {
      margin: 16px;
      border: 1px solid #1a2942;
    }

    .card-header {
      background-color: #1a2942;
      color: #ffffff;
      padding: 10px 14px;
      font-size: 0.9rem;
      font-weight: 700;
    }

    .card-body {
      padding: 16px;
    }

    .form-group {
      margin-bottom: 14px;
    }

    .form-label {
      display: block;
      font-size: 0.75rem;
      font-weight: 700;
      color: #374151;
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .form-control {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #d1d5db;
      border-radius: 4px;
      font-size: 0.9rem;
      background-color: #f9fafb;
      outline: none;
    }

    .form-control:focus {
      border-color: #2563eb;
      background-color: #fff;
    }

    .status-box {
      background-color: #f9fafb;
      border: 1px solid #d1d5db;
      border-radius: 4px;
      padding: 10px 12px;
      color: #16a34a;
      font-weight: 700;
      font-size: 0.9rem;
    }

    /* Nested Sub-Card */
    .sub-card {
      border: 1px solid #1a2942;
      margin-top: 18px;
      margin-bottom: 18px;
    }

    .sub-card-header {
      background-color: #1a2942;
      color: #ffffff;
      padding: 8px 12px;
      font-size: 0.8rem;
      font-weight: 700;
      text-transform: uppercase;
    }

    .sub-card-body {
      padding: 14px;
    }

    .sub-card-body .form-label {
      text-align: center;
    }

    .sub-card-body .form-control {
      text-align: center;
    }

    /* Action Buttons */
    .btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 4px;
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
      margin-bottom: 8px;
      text-transform: uppercase;
    }

    .btn-success {
      background-color: #10b981;
      color: #ffffff;
    }

    .btn-success:hover {
      background-color: #059669;
    }

    .btn-dark {
      background-color: #1a2942;
      color: #ffffff;
    }

    .btn-dark:hover {
      background-color: #111c2e;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Header / Navbar -->
    <header class="navbar">
      <div class="nav-left">
        <span class="menu-icon">&#9776;</span>
        <span>Kelola Deposit</span>
      </div>
      <div class="nav-right">
        Admin Setting &#9662;
      </div>
    </header>

    <!-- Notifikasi Sukses -->
    <div id="successAlert" class="alert"></div>

    <!-- Main Card -->
    <div class="card">
      <div class="card-header">
        Input Data Transaksi
      </div>
      <div class="card-body">
        
        <div class="form-group">
          <label class="form-label" for="uidWhatsapp">UID / Nomor Whatsapp</label>
          <input type="text" id="uidWhatsapp" class="form-control" placeholder="Contoh: 6287757654682">
        </div>

        <div class="form-group">
          <label class="form-label" for="nominalJp">Nominal JP</label>
          <input type="text" id="nominalJp" class="form-control" placeholder="Masukkan Nominal JP (cth: 1.500.200)">
        </div>

        <div class="form-group">
          <label class="form-label">Status Proses</label>
          <div class="status-box">PROSES = DONE</div>
        </div>

        <!-- Section Balance / Deposit -->
        <div class="sub-card">
          <div class="sub-card-header">Balance/Deposit</div>
          <div class="sub-card-body">
            
            <div class="form-group">
              <label class="form-label" for="jumlahBet">Jumlah Bet</label>
              <select id="jumlahBet" class="form-control">
                <option value="800">800</option>
                <option value="1000">1000</option>
                <option value="1200">1200</option>
                <option value="1600">1600</option>
                <option value="2000">2000</option>
                <option value="2500">2500</option>
                <option value="3000">3000</option>
                <option value="3500">3500</option>
                <option value="4000">4000</option>
                <option value="4500">4500</option>
                <option value="5000">5000</option>
              </select>
            </div>

            <div class="form-group">
              <label class="form-label" for="gameProvider">Game Provider</label>
              <select id="gameProvider" class="form-control">
                <option value="PG SOFT">PG SOFT</option>
                <option value="PRAGMATIC PLAY">PRAGMATIC PLAY</option>
                <option value="NO LIMIT CITY">NO LIMIT CITY</option>
              </select>
            </div>

            <div class="form-group">
              <label class="form-label" for="balanceDeposit">Balance/Deposit</label>
              <select id="balanceDeposit" class="form-control">
                <option value="Rp 50.000">Rp 50.000</option>
                <option value="Rp 60.000">Rp 60.000</option>
                <option value="Rp 70.000">Rp 70.000</option>
                <option value="Rp 80.000">Rp 80.000</option>
                <option value="Rp 90.000">Rp 90.000</option>
                <option value="Rp 100.000">Rp 100.000</option>
                <option value="Rp 125.000">Rp 125.000</option>
                <option value="Rp 150.000">Rp 150.000</option>
                <option value="Rp 175.000">Rp 175.000</option>
                <option value="Rp 200.000">Rp 200.000</option>
              </select>
            </div>

            <div class="form-group" style="margin-bottom: 0;">
              <label class="form-label" for="settings">Settings</label>
              <select id="settings" class="form-control">
                <option value="Kemenangan">Kemenangan</option>
                <option value="Auto Win">Auto Win</option>
                <option value="Auto JP">Auto JP</option>
                <option value="Sensational">Sensational</option>
                <option value="Pasti Withdraw">Pasti Withdraw</option>
              </select>
            </div>

          </div>
        </div>

        <!-- Tombol Aksi -->
        <button type="button" class="btn btn-success" id="btnProses">Proses Sekarang</button>
        <button type="button" class="btn btn-dark" id="btnLihatData">Lihat Data</button>

      </div>
    </div>
  </div>

  <script>
    document.getElementById('btnProses').addEventListener('click', function () {
      const uidInput = document.getElementById('uidWhatsapp').value.trim();
      const alertBox = document.getElementById('successAlert');

      if (uidInput === '') {
        alert('Silakan masukkan UID / Nomor WhatsApp terlebih dahulu.');
        return;
      }

      alertBox.textContent = 'Data untuk ID: ' + uidInput + ' berhasil diproses!';
      alertBox.style.display = 'block';

      // Gulir ke atas agar notifikasi terlihat
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });
  </script>
</body>
</html>
